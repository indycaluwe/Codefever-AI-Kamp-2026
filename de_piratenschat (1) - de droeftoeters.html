<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Piratenschat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts voor een piratensfeer -->
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .font-pirate {
            font-family: 'Pirata One', cursive;
        }
        .font-story {
            font-family: 'Crimson Pro', serif;
        }
        /* Custom scrollbar voor retro text-box look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 119, 6, 0.6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(217, 119, 6, 0.8);
        }
        /* Rustige animatie voor zwevende elementen */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        /* Water animatie */
        @keyframes wave {
            0%, 100% { transform: translateX(0) scaleY(1); }
            50% { transform: translateX(-2%) scaleY(1.05); }
        }
        .animate-wave {
            animation: wave 8s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-amber-50 min-h-screen flex flex-col justify-between overflow-x-hidden font-story selection:bg-amber-700 selection:text-white">

    <!-- Geluidselement voor achtergrondmuziek -->
    <audio id="bg-music" src="De Zee van Stille Schreeuwen (1).mp3" loop></audio>

    <!-- Header met titel -->
    <header class="border-b border-amber-900/40 bg-slate-900/80 backdrop-blur-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl md:text-4xl font-pirate tracking-wider text-amber-500 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] animate-pulse">
                ☠️ De Piratenschat
            </h1>
            <div class="flex items-center gap-4">
                <span id="game-status" class="text-xs md:text-sm bg-amber-950/80 text-amber-400 border border-amber-800/60 px-3 py-1 rounded-full font-mono">
                    Hoofdstuk 1: Het Piratenschip
                </span>
                <button onclick="toggleMute()" id="mute-btn" class="text-amber-400 hover:text-amber-300 transition text-lg" title="Geluid aan/uit">
                    🔊
                </button>
            </div>
        </div>
    </header>

    <!-- Hoofdcontainer voor het verhaal -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-4xl bg-slate-900/95 border-2 border-amber-900/60 rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[500px]">
            
            <!-- Visuele kant (Illustratie / Puzzel / Minigame) -->
            <div class="w-full md:w-1/2 bg-slate-950 relative border-b md:border-b-0 md:border-r border-amber-900/40 flex items-center justify-center p-6 min-h-[280px] md:min-h-0">
                
                <!-- Achtergrond sfeerlicht -->
                <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 via-transparent to-black pointer-events-none"></div>

                <!-- Dynamische SVG schermen gebaseerd op de game state -->
                <div id="visual-container" class="w-full h-full flex items-center justify-center">
                    <!-- Wordt dynamisch gevuld met JS -->
                </div>
            </div>

            <!-- Interactieve Verhaallijn kant -->
            <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between h-[450px] md:h-[550px]">
                
                <!-- Tekstgedeelte met scroll -->
                <div class="overflow-y-auto pr-2 flex-grow mb-6">
                    <p id="story-text" class="text-lg md:text-xl leading-relaxed text-slate-300 transition-opacity duration-300">
                        Laat het avontuur beginnen...
                    </p>
                </div>

                <!-- Keuzes / Interactie knoppen -->
                <div id="action-panel" class="space-y-3">
                    <!-- Knoppen verschijnen hier dynamisch -->
                </div>
            </div>

        </div>
    </main>

    <!-- Zoom Modal voor de schatkaart -->
    <div id="zoom-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4" onclick="closeZoom()">
        <div class="relative max-w-4xl w-full flex flex-col items-center">
            <img id="zoomed-image" src="" alt="Ingezoomde Schatkaart" class="max-w-full max-h-[80vh] rounded-xl border-4 border-amber-500 shadow-2xl object-contain">
            <p class="text-amber-400 mt-4 text-sm md:text-base font-semibold font-mono bg-amber-950/80 px-4 py-2 rounded-full border border-amber-800/60 shadow-lg animate-pulse">
                ✕ Klik ergens om te sluiten
            </p>
        </div>
    </div>

    <!-- Custom Popups / Feedback Boxen -->
    <div id="alert-box" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-500 max-w-md w-full p-6 rounded-xl shadow-2xl text-center">
            <h3 id="alert-title" class="text-2xl font-pirate text-amber-500 mb-2">Melding</h3>
            <p id="alert-message" class="text-slate-300 mb-6">Inhoud van de melding...</p>
            <button onclick="closeAlert()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-6 py-2 rounded-lg transition-colors">
                Begrepen!
            </button>
        </div>
    </div>

        <p>Gemaakt voor dappere avonturiers. Los alle puzzels op en breng de schat veilig naar de president!</p>

    <!-- Game Logic -->
    <script>
        // --- GELUIDSSYSTEEM (Web Audio API & Achtergrondmuziek) ---
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Start muziek bij de allereerste interactie om browser-restricties te omzeilen
        function startMusic() {
            const bgMusic = document.getElementById('bg-music');
            if (bgMusic && bgMusic.paused && !isMuted) {
                bgMusic.play().catch(e => console.log("Muziek kon nog niet starten:", e));
            }
        }
        document.addEventListener('click', startMusic, { once: true });
        document.addEventListener('touchstart', startMusic, { once: true });

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'splash') {
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.4);
            } else if (type === 'unlock') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(261.63, now); // C4
                osc.frequency.setValueAtTime(329.63, now + 0.1); // E4
                osc.frequency.setValueAtTime(392.00, now + 0.2); // G4
                osc.frequency.setValueAtTime(523.25, now + 0.3); // C5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'chime') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function toggleMute() {
            const bgMusic = document.getElementById('bg-music');
            isMuted = !isMuted;
            if (bgMusic) {
                bgMusic.muted = isMuted;
                if (!isMuted && bgMusic.paused) {
                    bgMusic.play().catch(e => console.log("Muziek kon niet starten:", e));
                }
            }
            document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
        }

        // --- CUSTOM ALERTS ---

            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-box').classList.remove('hidden');
        }

        // --- HANDIGE ZOOM HOOKS ---
        function closeAlert() {
            document.getElementById('alert-box').classList.add('hidden');
            playSound('click');
        }

            const modal = document.getElementById('zoom-modal');
            const zoomedImg = document.getElementById('zoomed-image');
            if (modal && zoomedImg) {
                zoomedImg.src = src;
                modal.classList.remove('hidden');
                playSound('chime');
            }
        }

        function closeZoom() {
            const modal = document.getElementById('zoom-modal');
            if (modal) {
                modal.classList.add('hidden');
                playSound('click');
            }
        }

        // --- PUZZEL 1 LOGICA (Zoekplaat) ---
        function checkZoekplaatResult() {
            const ansInput = document.getElementById('zoekplaat-input');
            if (!ansInput) return;
            const ans = ansInput.value.trim().toUpperCase();
            
            if (ans === '8G' || ans === '8 G') {
                playSound('unlock');
                showAlert("Schat Gevonden!", "Super gedaan! Je hebt de verborgen grot met de gouden schat precies gevonden op coördinaat 8G! Nu moeten we snel de edelstenen oplossen.");
                renderScene('puzzel_juwelen_intro');
            } else {
                playSound('fail');
                showAlert("Niet correct...", "Dat is niet het juiste coördinaat op de kaart. Kijk nog eens heel goed! (Tip: zoek de heldere gouden gloed in de grot, en voer eerst het getal bovenaan en dan de letter links in, bijvoorbeeld '1A').");
            }
        }

        // --- PUZZEL 2 LOGICA (Juwelen) ---
        function clickGem(color) {
            playSound('chime');
            
            const glowEl = document.getElementById(`glow-${color}`);
            if (glowEl) {
                glowEl.setAttribute('stroke-width', '4');
                glowEl.setAttribute('r', '22');
                setTimeout(() => {
                    glowEl.setAttribute('stroke-width', '0');
                    glowEl.setAttribute('r', '18');
                }, 300);
            }

            if (gemSequence.length < 3) {
                gemSequence.push(color);
                
                const display = document.getElementById('gem-status-display');
                if (display) {
                    display.innerHTML = gemSequence.map(c => {
                        let colorClass = c === 'Rood' ? 'text-red-500' : (c === 'Blauw' ? 'text-blue-500' : 'text-emerald-500');
                        return `<span class="${colorClass} font-bold mr-2">♦ ${c}</span>`;
                    }).join(' ');
                }
            }

            if (gemSequence.length === 3) {
                if (gemSequence[0] === 'Blauw' && gemSequence[1] === 'Rood' && gemSequence[2] === 'Groen') {
                    setTimeout(() => {
                        playSound('unlock');
                        showAlert("Kist Geopend!", "De edelstenen lichten prachtig op en de kist klikt met een magisch geluid helemaal open!");
                        renderScene('kelder_intro');
                    }, 400);
                } else {
                    setTimeout(() => {
                        playSound('fail');
                        showAlert("Oeps!", "De edelstenen knipperen rood... Dat is de verkeerde combinatie. Probeer het nog eens!");
                        resetGems();
                    }, 400);
                }
            }
        }

                } else {
                    playSound('fail');
                    showAlert("Onjuiste code!", "Die code klopt niet. Speel de vlucht-minigame om de juiste code te krijgen!");
                    clearCode();
                }
            } else if (currentScene === 'invoeren_poortwaker_code') {
                if (enteredCode === '4370') {
                    playSound('unlock');
                    showAlert("Toegang Verleend!", "De code klopt! De poortwaker knikt en opent langzaam de paleisdeuren voor je!");
                    renderScene('gewonnen');
                } else {
                    playSound('fail');
                    showAlert("Toegang Geweigerd!", "Dat is niet de geheime code van de poortwaker. Praat met hem via de link om de juiste code te krijgen!");
                    clearCode();
                }
            }
        }

        function resetPuzzel() {
            keySequence = [];
            gemSequence = [];
            routeStep = 0;
            basementHintsFound = { schilderij: false, krat: false, spin: false };
        }

        function resetGame() {
            resetPuzzel();
        }


        // --- PUZZEL 4 LOGICA (Interactieve Routekaart) ---
        function clickMapCheckpoint(step) {
            playSound('click');
            
            if (step === 'wrong-ship') {
                playSound('fail');
                showAlert("Hinderlaag!", "Oh nee! Daar ligt het schip van de piraten! Ze zien je meteen staan en je moet vluchten. Probeer een andere weg.");
                return;
            }
            if (step === 'wrong-swamp') {
                playSound('fail');
                showAlert("Doodlopend!", "Oeps! Je loopt een gevaarlijk moeras in vol knijpende krabben. Je kunt hier niet verder.");
                return;
            }

            const routeStatus = document.getElementById('route-status-text');

            if (step === 1 && routeStep === 0) {
                routeStep = 1;
                document.getElementById('map-cp-1').classList.remove('opacity-40');
                document.getElementById('circle-cp-1').setAttribute('stroke', '#10b981');
                document.getElementById('circle-cp-1').setAttribute('stroke-width', '3');
                document.getElementById('map-cp-2').classList.remove('opacity-40');
                if (routeStatus) {
                    routeStatus.innerHTML = "<span class='text-yellow-400'>Stap 1 voltooid! Strand bereikt. Klik nu op Checkpoint 2 (Bloemenbos)...</span>";
                }
            } else if (step === 2 && routeStep === 1) {
                routeStep = 2;
                const path1 = document.getElementById('route-path-1');
                if (path1) {
                    path1.setAttribute('stroke', '#10b981');
                    path1.setAttribute('stroke-width', '3');
                    path1.setAttribute('opacity', '1');
                }
                document.getElementById('map-cp-2').classList.remove('opacity-40');
                document.getElementById('circle-cp-2').setAttribute('stroke', '#10b981');
                document.getElementById('circle-cp-2').setAttribute('stroke-width', '3');
                document.getElementById('map-cp-3').classList.remove('opacity-40');
                if (routeStatus) {
                    routeStatus.innerHTML = "<span class='text-yellow-400'>Stap 2 voltooid! Bos bereikt. Klik nu op Checkpoint 3 (Paleis van de President)...</span>";
                }
            } else if (step === 3 && routeStep === 2) {
                routeStep = 3;
                const path2 = document.getElementById('route-path-2');
                if (path2) {
                    path2.setAttribute('stroke', '#10b981');
                    path2.setAttribute('stroke-width', '3');
                    path2.setAttribute('opacity', '1');
                }
                document.getElementById('map-cp-3').classList.remove('opacity-40');
                document.getElementById('circle-cp-3').setAttribute('stroke', '#10b981');
                document.getElementById('circle-cp-3').setAttribute('stroke-width', '3');
                if (routeStatus) {
                    routeStatus.innerHTML = "<span class='text-emerald-400 font-bold'>Route succesvol gepland! Je wordt doorgestuurd...</span>";
                }
                setTimeout(() => {
                    playSound('unlock');
                    showAlert("Route compleet!", "Je hebt de perfecte sluiproute naar de president getekend. Nu snel verder!");
                    renderScene('vlucht_instructie');
                }, 500);
            } else {
                playSound('fail');
                showAlert("Verkeerde volgorde!", "Je moet de route stap voor stap opbouwen. Volg de aanwijzingen op het perkament!");
            }
        }


        // --- RENDER SCÈNE ENGINE ---
        function renderScene(sceneKey) {
            currentScene = sceneKey;
            const scene = StoryData[sceneKey];
            if (!scene) return;

            document.getElementById('game-status').innerText = scene.status;

            const visualContainer = document.getElementById('visual-container');

            // Bepaal de visualisatie: als het de zoekplaat is tonen we de geüploade kaart met zoom-optie
            if (scene.isZoekplaatPuzzel) {
                visualContainer.innerHTML = `
                    <div class="relative w-full h-full flex flex-col justify-center items-center group cursor-zoom-in" onclick="zoomImage('Schatkaart.png')">
                        <img src="Schatkaart.png" alt="Schatkaart Zoekplaat" class="max-w-full max-h-[300px] md:max-h-[380px] rounded-xl border-2 border-amber-800/80 shadow-2xl object-contain group-hover:scale-105 group-hover:border-amber-500 transition-all duration-300" onerror="this.onerror=null; this.src='https://placehold.co/600x400?text=Schatkaart+Fout';">
                        <div class="absolute bottom-2 bg-slate-950/90 border border-amber-500/40 text-amber-400 text-xs px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none flex items-center gap-1 shadow-lg">
                            <span>🔍 Klik om te vergroten</span>
                        </div>
                    </div>
                `;
            } else {
                visualContainer.innerHTML = scene.svg;
            }

            const textEl = document.getElementById('story-text');
            textEl.innerHTML = scene.text;

            const actionPanel = document.getElementById('action-panel');
            actionPanel.innerHTML = '';

            if (scene.isZoekplaatPuzzel) {
                actionPanel.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/60 shadow-inner space-y-3">
                        <p class="text-xs text-slate-400 italic text-center">Bekijk de kaart goed (klik erop om in te zoomen!). Voer de coördinaten in (bijv. 1A).</p>
                        <div class="flex justify-center gap-2">
                            <input id="zoekplaat-input" type="text" class="w-36 bg-black border-2 border-amber-700 text-amber-500 text-center font-mono text-2xl py-2 rounded-lg tracking-wider" placeholder="bijv. 1A" maxlength="4">
                            <button onclick="checkZoekplaatResult()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-6 py-2 rounded-lg transition-colors">Controleer</button>
                        </div>
                    </div>
                `;
                // Toevoegen van een 'Enter' snelkoppeling in het invoerveld
                setTimeout(() => {
                    const input = document.getElementById('zoekplaat-input');
                    if (input) {
                        input.focus();
                        input.addEventListener('keypress', (e) => {
                            if (e.key === 'Enter') checkZoekplaatResult();
                        });
                    }
                }, 50);
            } else if (scene.isJuwelenPuzzel) {
                actionPanel.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/60 shadow-inner space-y-3 text-center">
                        <p class="text-xs text-slate-400 italic">Druk op de gekleurde diamanten in de afbeelding in de juiste volgorde volgens de stem!</p>
                        <button onclick="resetGems()" class="bg-red-950 text-red-400 border border-red-800 hover:bg-red-900 px-4 py-2 rounded-lg transition-colors text-sm font-semibold">
                            Reset Edelstenen ⟲
                        </button>
                    </div>
                `;
            } else if (scene.isPuzzel) {
                actionPanel.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/60 shadow-inner">
                        <label class="block text-xs font-mono uppercase text-amber-500 mb-2 tracking-widest text-center">🔐 Interactief Cijferslot (3 cijfers)</label>
                        <div class="flex justify-center gap-2 mb-3">
                            <input id="code-display" type="text" readonly class="w-36 bg-black border-2 border-amber-700 text-amber-500 text-center font-mono text-2xl py-1 rounded-lg tracking-wider" placeholder="---">
                            <button onclick="checkCode()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-4 rounded-lg transition-colors">OK</button>
                            <button onclick="clearCode()" class="bg-red-950 text-red-400 border border-red-800 hover:bg-red-900 px-3 rounded-lg transition-colors">C</button>
                        </div>
                        <div class="grid grid-cols-5 gap-2 max-w-[250px] mx-auto">
                            ${[1,2,3,4,5,6,7,8,9,0].map(n => `
                                <button onclick="enterCodeDigit(${n})" class="bg-slate-800 hover:bg-slate-700 text-amber-100 font-bold py-2 rounded-lg text-sm transition-colors border border-slate-700">${n}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
                setTimeout(updateHintDisplay, 50);
            } else if (scene.isRoutePuzzel) {
                actionPanel.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/60 shadow-inner text-center space-y-2">
                        <p class="text-xs text-slate-400 italic">Klik direct op de ronde checkpoints op de kaart hierboven om de veilige vluchtroute te ontdekken!</p>
                    </div>
                `;
            } else if (scene.isVluchtInstructie) {
                actionPanel.innerHTML = `
                    <div class="space-y-3">
                        <a href="https://wegnaarpresident.lovable.app" target="_blank" rel="noopener noreferrer" onclick="playSound('click')" class="w-full text-center bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 border border-emerald-500 text-white font-bold py-4 px-5 rounded-xl transition-all duration-200 block shadow-lg transform hover:-translate-y-1">
                            🎮 Start de Vlucht op wegnaarpresident.lovable.app ➔
                        </a>
                        <button onclick="playSound('click'); renderScene('invoeren_vlucht_code');" class="w-full text-center bg-slate-800 hover:bg-slate-700 border border-amber-900/60 text-amber-300 font-medium py-3 px-5 rounded-xl transition-all">
                            Ik heb de code! (Vul code in) ➔
                        </button>
                    </div>
                `;
            } else if (scene.isVluchtCodePuzzel || scene.isPoortwakerCodePuzzel) {
                actionPanel.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/60 shadow-inner">
                        <label class="block text-xs font-mono uppercase text-amber-500 mb-2 tracking-widest text-center">🔐 Voer de 4-cijferige Code In</label>
                        <div class="flex justify-center gap-2 mb-3">
                            <input id="code-display" type="text" readonly class="w-36 bg-black border-2 border-amber-700 text-amber-500 text-center font-mono text-2xl py-1 rounded-lg tracking-wider" placeholder="----">
                            <button onclick="checkCode()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-4 rounded-lg transition-colors">OK</button>
                            <button onclick="clearCode()" class="bg-red-950 text-red-400 border border-red-800 hover:bg-red-900 px-3 rounded-lg transition-colors">C</button>
                        </div>
                        <div class="grid grid-cols-5 gap-2 max-w-[250px] mx-auto">
                            ${[1,2,3,4,5,6,7,8,9,0].map(n => `
                                <button onclick="enterCodeDigit(${n})" class="bg-slate-800 hover:bg-slate-700 text-amber-100 font-bold py-2 rounded-lg text-sm transition-colors border border-slate-700">${n}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (scene.isPoortwakerIntro) {
                actionPanel.innerHTML = `
                    <div class="space-y-3">
                        <a href="https://gemini.google.com/gem/19TY34REhJ1ffYkP7dB9ZnU4tF7pqDr0b?usp=sharing" target="_blank" rel="noopener noreferrer" onclick="playSound('click')" class="w-full text-center bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 border border-blue-500 text-white font-bold py-4 px-5 rounded-xl transition-all duration-200 block shadow-lg transform hover:-translate-y-1">
                            💬 Praat met de Poortwaker op Gemini ➔
                        </a>
                        <button onclick="playSound('click'); renderScene('invoeren_poortwaker_code');" class="w-full text-center bg-slate-800 hover:bg-slate-700 border border-amber-900/60 text-amber-300 font-medium py-3 px-5 rounded-xl transition-all">
                            Ik heb de poortcode! (Vul code in) ➔
                        </button>
                    </div>
                `;
            } else if (scene.choices) {
                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left bg-gradient-to-r from-amber-950/80 to-slate-900 hover:from-amber-900/90 hover:to-amber-950/50 border border-amber-900/60 hover:border-amber-500 text-amber-200 hover:text-white font-medium py-3 px-5 rounded-xl transition-all duration-200 flex justify-between items-center group shadow-md";
                    
                    btn.onclick = () => {
                        playSound('click');
                        if (choice.action) choice.action();
                        renderScene(choice.next);
                    };

                    btn.innerHTML = `
                        <span>${choice.text}</span>
                        <span class="transform group-hover:translate-x-1 transition-transform text-amber-500">➔</span>
                    `;
                    actionPanel.appendChild(btn);
                });
            }
        }

        // Start het spel direct op de introductie-pagina
        window.onload = function() {
            renderScene('intro');
        };
    </script>
</body>
</html>
